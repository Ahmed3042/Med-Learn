<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med-Learn — Medical Education Platform</title>
    <meta name="description" content="Med-Learn: A professional medical education platform for university students." />
    <script>
      // Apply persisted theme before paint to prevent flash
      try {
        const theme = JSON.parse(localStorage.getItem('medlearn:settings:theme') || '"light"');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (theme === 'system') {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
        // Apply font size
        const fs = JSON.parse(localStorage.getItem('medlearn:settings:fontSize') || '"normal"');
        const fsMap = { small: '14px', normal: '16px', large: '18px' };
        document.documentElement.style.fontSize = fsMap[fs] || '16px';
      } catch {}
    </script>
    <!--
      GitHub Pages SPA redirect absorber (companion to public/404.html).
      When GitHub Pages bounces a deep-link through 404.html it encodes the
      real path as a query-string. This snippet decodes it and restores the
      correct URL via history.replaceState so React Router sees the right path.
    -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Decode the ?/ encoding used by public/404.html
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
