<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Med-Learn</title>
    <!--
      GitHub Pages SPA redirect.
      When a user navigates directly to a deep route (e.g. /Med-Learn/dashboard)
      GitHub Pages serves this 404.html. This script encodes the full path into
      the query string and redirects to the index page, which decodes it and
      restores the URL via the History API before React Router takes over.

      Technique: https://github.com/rafgraph/spa-github-pages
      The "pathSegmentsToKeep" value must match the repo name depth.
      For a project site at https://user.github.io/Med-Learn/, set it to 1.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
